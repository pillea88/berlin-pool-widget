name: Update Pool Data
on:
  schedule:
    - cron: '15 * * * *' # Runs at minute 15 of every hour
  workflow_dispatch:      # Lets you run it manually with a button click

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run scraper
        run: python3 scraper.py
      - name: Save updated JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pools.json
          git commit -m "Update pool temperatures" || exit 0
          git push
